<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema inteligente de gestión de inventarios</title>

<style>
:root {
    --azul: #172554;
    --azul-claro: #2563eb;
    --oscuro: #111827;
    --fondo: #f4f6f9;
    --blanco: #ffffff;
    --gris: #6b7280;
    --rojo: #dc2626;
    --amarillo: #d97706;
    --verde: #16a34a;
    --borde: #e5e7eb;
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--fondo);
    color: #1f2937;
}

header {
    background: var(--azul);
    color: white;
    padding: 22px 30px;
}

header h1 {
    margin: 0 0 7px;
    font-size: 27px;
}

header p {
    margin: 0;
    opacity: 0.9;
}

.contenedor {
    display: flex;
    min-height: calc(100vh - 103px);
}

.sidebar {
    width: 230px;
    background: var(--oscuro);
    padding: 22px 14px;
    color: white;
}

.sidebar h2 {
    text-align: center;
    font-size: 17px;
}

.menu {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    color: white;
    text-align: left;
    padding: 13px;
    margin: 5px 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.menu:hover,
.menu.activo {
    background: #1e3a8a;
}

.principal {
    flex: 1;
    padding: 27px;
    min-width: 0;
}

.vista {
    display: none;
}

.vista.activa {
    display: block;
}

.titulo {
    margin-bottom: 18px;
}

.titulo h2 {
    margin: 0;
    font-size: 24px;
}

.titulo p {
    color: var(--gris);
    margin-top: 5px;
}

.kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
}

.kpi,
.tarjeta {
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.kpi h3 {
    margin: 0 0 9px;
    color: var(--gris);
    font-size: 13px;
}

.kpi strong {
    font-size: 26px;
}

.tarjeta {
    margin-bottom: 20px;
}

.tarjeta h3 {
    margin-top: 0;
    color: var(--azul);
}

.herramientas {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

input,
select {
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 7px;
    background: white;
}

#buscar {
    min-width: 240px;
    flex: 1;
}

.boton {
    border: none;
    border-radius: 8px;
    padding: 10px 14px;
    color: white;
    background: var(--azul-claro);
    font-weight: bold;
    cursor: pointer;
}

.boton:hover {
    filter: brightness(0.93);
}

.boton-verde {
    background: var(--verde);
}

.boton-rojo {
    background: var(--rojo);
}

.boton-gris {
    background: #475569;
}

.boton-pequeno {
    padding: 7px 9px;
    font-size: 12px;
}

.tabla-contenedor {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 850px;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid var(--borde);
    text-align: left;
    font-size: 13px;
}

th {
    background: #f3f4f6;
}

.insignia {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 14px;
    font-size: 11px;
    font-weight: bold;
}

.riesgo-Alto {
    background: #fee2e2;
    color: #b91c1c;
}

.riesgo-Medio {
    background: #fef3c7;
    color: #92400e;
}

.riesgo-Bajo {
    background: #dcfce7;
    color: #166534;
}

.alerta {
    padding: 15px;
    border-left: 5px solid var(--rojo);
    background: #fff5f5;
    border-radius: 8px;
    margin-bottom: 12px;
}

.aviso {
    padding: 13px;
    background: #eff6ff;
    border-left: 5px solid var(--azul-claro);
    border-radius: 8px;
    margin-bottom: 15px;
}

.formulario {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.formulario label {
    font-size: 13px;
    font-weight: bold;
}

.formulario label span {
    display: block;
    margin-bottom: 5px;
}

.formulario input,
.formulario select {
    width: 100%;
}

.acciones {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 20;
}

.modal.activo {
    display: flex;
}

.modal-contenido {
    background: white;
    width: 100%;
    max-width: 700px;
    max-height: 90vh;
    overflow: auto;
    border-radius: 12px;
    padding: 22px;
}

.modal-cabecera {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.cerrar {
    border: none;
    background: transparent;
    font-size: 27px;
    cursor: pointer;
}

.interpretacion {
    line-height: 1.6;
}

@media (max-width: 950px) {
    .contenedor {
        display: block;
    }

    .sidebar {
        width: 100%;
        display: flex;
        overflow-x: auto;
        gap: 5px;
    }

    .sidebar h2 {
        display: none;
    }

    .menu {
        width: auto;
        white-space: nowrap;
    }

    .kpis {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 570px) {
    header h1 {
        font-size: 21px;
    }

    .principal {
        padding: 17px;
    }

    .kpis,
    .formulario {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>📦 Sistema inteligente de gestión de inventarios</h1>
    <p>Control, alertas y análisis explicable de riesgo</p>
</header>

    </button>

        📦 Inventario
    </button>

    <button class="menu" data-vista="alertas">
        ⚠️ Alertas
    </button>

    <button class="menu" data-vista="analisis">
        🤖 Análisis IA
